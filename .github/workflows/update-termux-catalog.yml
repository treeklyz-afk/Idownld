name: Refresh Termux package catalog

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh package versions from official Termux repository
        run: python3 .github/scripts/update_termux_catalog.py
      - name: Commit catalog changes when versions changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Termux package catalog versions"
            git push origin HEAD:main
          else
            echo "Catalog is already current."
          fi
