                                      Text("Debug Console", color = cyanAccent, style = MaterialTheme.typography.labelLarge, fontWeight = FontWeight.Bold)
                                      logsState.value.forEach { line ->
                                          Text(
                                              line,
                                              color = Color(0xFFCBD5E1),
                                              style = MaterialTheme.typography.bodySmall,
                                              fontFamily = FontFamily.Monospace,
                                              maxLines = 2,
                                              overflow = TextOverflow.Ellipsis
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Fetch ARM64 binaries into assets/tools and jniLibs/arm64-v8a
        run: |
          mkdir -p app/src/main/assets/tools app/src/main/jniLibs/arm64-v8a
          curl -fsSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux_aarch64 -o app/src/main/assets/tools/yt-dlp || true
          curl -fsSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-arm64-static.tar.xz -o /tmp/ffmpeg.tar.xz || true
          if [ -f /tmp/ffmpeg.tar.xz ]; then
            tar -xf /tmp/ffmpeg.tar.xz -C /tmp
            cp /tmp/ffmpeg-*-arm64-static/ffmpeg app/src/main/assets/tools/ffmpeg || true
            cp /tmp/ffmpeg-*-arm64-static/ffprobe app/src/main/assets/tools/ffprobe || true
          fi
          chmod +x app/src/main/assets/tools/* 2>/dev/null || true
          if [ -f app/src/main/assets/tools/yt-dlp ]; then
            cp app/src/main/assets/tools/yt-dlp app/src/main/jniLibs/arm64-v8a/libytdlp.so
          fi
          if [ -f app/src/main/assets/tools/ffmpeg ]; then
            cp app/src/main/assets/tools/ffmpeg app/src/main/jniLibs/arm64-v8a/libffmpeg.so
          fi
          if [ -f app/src/main/assets/tools/ffprobe ]; then
            cp app/src/main/assets/tools/ffprobe app/src/main/jniLibs/arm64-v8a/libffprobe.so
          fi

      - name: Push scaffolded project sources to main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Build PyServer 2.0 APK with native libs, media UI & PKG terminal"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

      - name: Setup JDK 17 & Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle CLI
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper exists
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x ./gradlew

      - name: Smart Build with Auto-Repair
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace > /tmp/gradle_build.log 2>&1
          EXIT_CODE=$?
          cat /tmp/gradle_build.log

          if [ $EXIT_CODE -ne 0 ]; then
            echo "Build failed — running smart auto-repair..."
            python3 - <<'PY'
          import pathlib, re

          log_text = pathlib.Path("/tmp/gradle_build.log").read_text(encoding="utf-8", errors="ignore")
          error_files = set(re.findall(r"e:\s*file://(/[^:\s]+\.kt):", log_text))
          for fpath in error_files:
              p = pathlib.Path(fpath)
              if not p.exists():
                  continue
              src = p.read_text(encoding="utf-8")
              orig = src
              src = re.sub(
                  r"\bvar\s+([A-Za-z0-9_]+)\s+by\s+remember\s*\{\s*mutableStateOf\((.*?)\)\s*\}",
                  r"val \1State = remember { mutableStateOf(\2) }",
                  src,
              )
              src = re.sub(r"\.value\.value\b", ".value", src)
              if src != orig:
                  p.write_text(src, encoding="utf-8")
                  print(f"Auto-repaired: {p}")
          PY
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyServer2-Complete-APK
          path: app/build/outputs/apk/debug/app-debug.apk
