name: Build PyServer 2.0 Smart APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smart-build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Scaffold clean Jetpack Compose project, GIF/JSON animation & Python bridge
        run: |
          set -e
          mkdir -p app/src/main/java/com/pyserver/v2
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets/tools
          mkdir -p app/src/main/assets/packages
          mkdir -p app/src/main/assets/scripts
          mkdir -p app/src/main/assets/animations

          cat <<'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PyServer2Studio"
          include(":app")
          EOF

          cat <<'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat <<'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat <<'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.pyserver.v2"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.pyserver.v2"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 4
                  versionName = "2.2.0"
              }

              buildFeatures {
                  compose = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation(platform("androidx.compose:compose-bom:2024.11.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.compose.material3:material3")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          EOF

          cat <<'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">PyServer 2.0</string>
          </resources>
          EOF

          cat <<'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="true"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".BackgroundEngineService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />
              </application>

          </manifest>
          EOF

          cat <<'EOF' > app/src/main/assets/animations/pulse_anim.json
          {
            "animation_name": "pyserver_pulse",
            "fps": 15,
            "scale_min": 0.96,
            "scale_max": 1.04,
            "gif_fps": 12,
            "gif_width": 480
          }
          EOF

          cat <<'EOF' > app/src/main/assets/scripts/engine_bridge.py
          import json
          import subprocess
          import sys


          def main():
              if len(sys.argv) < 3:
                  print(json.dumps({"ok": False, "error": "Usage: engine_bridge.py <ytdlp_bin> <url>"}))
                  sys.exit(1)

              ytdlp_bin = sys.argv[1]
              url = sys.argv[2]

              try:
                  proc = subprocess.run(
                      [ytdlp_bin, "-J", "--no-playlist", url],
                      capture_output=True,
                      text=True,
                      timeout=45,
                  )
                  if proc.returncode != 0:
                      print(json.dumps({"ok": False, "error": proc.stderr.strip() or "yt-dlp failed"}))
                      sys.exit(2)

                  data = json.loads(proc.stdout)
                  formats = []
                  seen = set()

                  for f in data.get("formats", []):
                      vcodec = f.get("vcodec", "none")
                      height = f.get("height")
                      fmt_id = f.get("format_id")
                      ext = f.get("ext", "mp4")
                      if vcodec != "none" and height and fmt_id:
                          label = f"{height}p ({str(ext).upper()})"
                          if label not in seen:
                              seen.add(label)
                              formats.append({
                                  "format_id": str(fmt_id),
                                  "label": label,
                                  "media_type": "video",
                              })

                  formats.sort(
                      key=lambda x: int(x["label"].split("p")[0])
                      if x["label"].split("p")[0].isdigit()
                      else 0,
                      reverse=True,
                  )
                  formats.append({
                      "format_id": "gif_clip",
                      "label": "Animated GIF (480w • 12fps)",
                      "media_type": "gif",
                  })
                  formats.append({
                      "format_id": "bestaudio",
                      "label": "Audio Only (MP3)",
                      "media_type": "audio",
                  })

                  print(json.dumps({
                      "ok": True,
                      "title": data.get("title", "Media"),
                      "extractor": data.get("extractor_key", "PythonBridge"),
                      "duration": data.get("duration_string", "N/A"),
                      "formats": formats,
                  }))
              except Exception as exc:
                  print(json.dumps({"ok": False, "error": str(exc)}))
                  sys.exit(3)


          if __name__ == "__main__":
              main()
          EOF

          cat <<'EOF' > app/src/main/java/com/pyserver/v2/PythonRunner.kt
          package com.pyserver.v2

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.File
          import java.io.FileOutputStream
          import java.io.InputStreamReader

          object PythonRunner {
              fun scriptsDir(context: Context): File = File(context.filesDir, "scripts").apply { mkdirs() }

              fun extractPythonScripts(context: Context) {
                  val dir = scriptsDir(context)
                  try {
                      val files = context.assets.list("scripts") ?: emptyArray()
                      for (name in files) {
                          val outFile = File(dir, name)
                          context.assets.open("scripts/$name").use { input ->
                              FileOutputStream(outFile).use { output -> input.copyTo(output) }
                          }
                          outFile.setReadable(true, false)
                      }
                  } catch (_: Exception) {
                  }
              }

              fun loadAnimationConfig(context: Context): JSONObject {
                  return try {
                      val raw = context.assets.open("animations/pulse_anim.json").bufferedReader().use { it.readText() }
                      JSONObject(raw)
                  } catch (_: Exception) {
                      JSONObject().apply {
                          put("fps", 15)
                          put("scale_min", 0.96)
                          put("scale_max", 1.04)
                          put("gif_fps", 12)
                          put("gif_width", 480)
                      }
                  }
              }

              fun findPythonExecutable(context: Context): String? {
                  val candidates = listOf(
                      File(context.filesDir, "bin/python3"),
                      File(context.filesDir, "packages/python3"),
                      File("/data/data/com.termux/files/usr/bin/python3"),
                      File("/system/bin/python3")
                  )
                  for (c in candidates) {
                      if (c.exists() && c.canExecute()) return c.absolutePath
                  }
                  return null
              }

              fun analyzeWithPythonBridge(context: Context, url: String): Result<MediaAnalysis> {
                  val pyBin = findPythonExecutable(context)
                      ?: return Result.failure(Exception("Python runtime not found"))
                  val scriptFile = File(scriptsDir(context), "engine_bridge.py")
                  if (!scriptFile.exists()) {
                      return Result.failure(Exception("engine_bridge.py missing"))
                  }
                  val ytdlpBin = AssetsAndPackageManager.resolveTool(context, "yt-dlp")

                  return try {
                      val proc = ProcessBuilder(pyBin, scriptFile.absolutePath, ytdlpBin, url)
                          .redirectErrorStream(false)
                          .start()
                      val stdout = BufferedReader(InputStreamReader(proc.inputStream)).readText()
                      val stderr = BufferedReader(InputStreamReader(proc.errorStream)).readText()
                      val code = proc.waitFor()
                      if (stdout.isBlank()) {
                          return Result.failure(Exception(stderr.ifBlank { "Exit $code" }))
                      }

                      val root = JSONObject(stdout)
                      if (!root.optBoolean("ok", false)) {
                          return Result.failure(Exception(root.optString("error", "Bridge error")))
                      }
                      val arr: JSONArray = root.optJSONArray("formats") ?: JSONArray()
                      val formats = mutableListOf<FormatChoice>()
                      for (i in 0 until arr.length()) {
                          val item = arr.getJSONObject(i)
                          formats.add(
                              FormatChoice(
                                  formatId = item.optString("format_id", "best"),
                                  titleLabel = item.optString("label", "Format"),
                                  mediaType = item.optString("media_type", "video"),
                                  metaInfo = "Python Bridge"
                              )
                          )
                      }
                      Result.success(
                          MediaAnalysis(
                              title = root.optString("title", "Media"),
                              extractor = root.optString("extractor", "PythonBridge"),
                              duration = root.optString("duration", "N/A"),
                              formats = formats
                          )
                      )
                  } catch (e: Exception) {
                      Result.failure(e)
                  }
              }
          }
          EOF

          cat <<'EOF' > app/src/main/java/com/pyserver/v2/AssetsAndPackageManager.kt
          package com.pyserver.v2

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL

          data class ManifestPackage(
              val id: String,
              val name: String,
              val version: String,
              val category: String,
              val filename: String,
              val url: String
          )

          data class ToolStatus(
              val name: String,
              val installed: Boolean,
              val version: String?,
              val path: String
          )

          object AssetsAndPackageManager {
              private const val PREFS = "pyserver2_prefs"
              private const val KEY_MANIFEST = "manifest_url"
              private const val DEFAULT_MANIFEST =
                  "https://raw.githubusercontent.com/YOUR_USER/pyserver-assets/main/manifest.json"

              fun binDir(context: Context): File = File(context.filesDir, "bin").apply { mkdirs() }
              fun pkgDir(context: Context): File = File(context.filesDir, "packages").apply { mkdirs() }

              fun getManifestUrl(context: Context): String =
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .getString(KEY_MANIFEST, DEFAULT_MANIFEST) ?: DEFAULT_MANIFEST

              fun setManifestUrl(context: Context, url: String) {
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .edit().putString(KEY_MANIFEST, url.trim()).apply()
              }

              fun getInstalledVersion(context: Context, id: String): String? =
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .getString("pkg_ver_$id", null)

              private fun setInstalledVersion(context: Context, id: String, version: String) {
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .edit().putString("pkg_ver_$id", version).apply()
              }

              fun extractAssetsOnStartup(context: Context, onLog: (String) -> Unit = {}) {
                  PythonRunner.extractPythonScripts(context)
                  val assetFolders = listOf("tools" to binDir(context), "packages" to pkgDir(context))
                  for ((folder, targetRoot) in assetFolders) {
                      try {
                          val files = context.assets.list(folder) ?: emptyArray()
                          for (name in files) {
                              val outFile = File(targetRoot, name)
                              context.assets.open("$folder/$name").use { input ->
                                  FileOutputStream(outFile).use { output -> input.copyTo(output) }
                              }
                              outFile.setReadable(true, false)
                              outFile.setExecutable(true, false)
                              onLog("Loaded asset: $folder/$name")
                          }
                      } catch (_: Exception) {
                      }
                  }
              }

              fun resolveTool(context: Context, name: String): String {
                  val candidates = listOf(
                      File(binDir(context), name),
                      File(pkgDir(context), name),
                      File(context.applicationInfo.nativeLibraryDir, "lib$name.so")
                  )
                  for (f in candidates) {
                      if (f.exists()) {
                          f.setReadable(true, false)
                          f.setExecutable(true, false)
                          if (f.canExecute()) return f.absolutePath
                      }
                  }
                  return name
              }

              fun getCoreToolsStatus(context: Context): List<ToolStatus> {
                  val core = listOf("yt-dlp", "ffmpeg", "ffprobe", "aria2c", "python3")
                  return core.map { tool ->
                      val resolved = if (tool == "python3") {
                          PythonRunner.findPythonExecutable(context) ?: "python3"
                      } else {
                          resolveTool(context, tool)
                      }
                      val file = File(resolved)
                      val exists = file.exists() && file.canExecute()
                      ToolStatus(
                          name = tool,
                          installed = exists,
                          version = getInstalledVersion(context, tool) ?: if (exists) "Ready" else null,
                          path = resolved
                      )
                  }
              }

              fun fetchManifest(context: Context, urlOverride: String? = null): Result<List<ManifestPackage>> {
                  return try {
                      val target = urlOverride?.trim()?.ifEmpty { null } ?: getManifestUrl(context)
                      val conn = (URL(target).openConnection() as HttpURLConnection).apply {
                          requestMethod = "GET"
                          instanceFollowRedirects = true
                          connectTimeout = 15000
                          readTimeout = 15000
                      }
                      if (conn.responseCode !in 200..299) {
                          return Result.failure(Exception("HTTP ${conn.responseCode}"))
                      }
                      val body = conn.inputStream.bufferedReader().readText()
                      conn.disconnect()
                      val root = JSONObject(body)
                      val arr: JSONArray = root.optJSONArray("packages") ?: JSONArray()
                      val items = mutableListOf<ManifestPackage>()
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          items.add(
                              ManifestPackage(
                                  id = o.getString("id"),
                                  name = o.optString("name", o.getString("id")),
                                  version = o.optString("version", "1.0.0"),
                                  category = o.optString("category", "package"),
                                  filename = o.optString("filename", o.getString("id")),
                                  url = o.getString("url")
                              )
                          )
                      }
                      Result.success(items)
                  } catch (e: Exception) {
                      Result.failure(e)
                  }
              }

              fun installPackage(
                  context: Context,
                  pkg: ManifestPackage,
                  onProgress: (String) -> Unit = {}
              ): Result<String> {
                  return try {
                      val targetDir = if (pkg.category == "package") pkgDir(context) else binDir(context)
                      val dest = File(targetDir, pkg.filename)
                      val temp = File(targetDir, "${pkg.filename}.download")
                      onProgress("Downloading ${pkg.name} v${pkg.version}...")
                      val conn = (URL(pkg.url).openConnection() as HttpURLConnection).apply {
                          requestMethod = "GET"
                          instanceFollowRedirects = true
                          connectTimeout = 20000
                          readTimeout = 60000
                      }
                      if (conn.responseCode !in 200..299) {
                          return Result.failure(Exception("HTTP ${conn.responseCode}"))
                      }
                      conn.inputStream.use { input ->
                          FileOutputStream(temp).use { output ->
                              val buf = ByteArray(16384)
                              while (true) {
                                  val n = input.read(buf)
                                  if (n == -1) break
                                  output.write(buf, 0, n)
                              }
                              output.flush()
                          }
                      }
                      conn.disconnect()
                      if (dest.exists()) dest.delete()
                      if (!temp.renameTo(dest)) {
                          temp.copyTo(dest, overwrite = true)
                          temp.delete()
                      }
                      dest.setReadable(true, false)
                      dest.setExecutable(true, false)
                      setInstalledVersion(context, pkg.id, pkg.version)
                      Result.success("Installed ${pkg.name} (v${pkg.version})")
                  } catch (e: Exception) {
                      Result.failure(e)
                  }
              }
          }
          EOF

          cat <<'EOF' > app/src/main/java/com/pyserver/v2/MediaDownloaderEngine.kt
          package com.pyserver.v2

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.File
          import java.io.FileOutputStream
          import java.io.InputStreamReader
          import java.net.HttpURLConnection
          import java.net.URL

          data class FormatChoice(
              val formatId: String,
              val titleLabel: String,
              val mediaType: String,
              val metaInfo: String
          )

          data class MediaAnalysis(
              val title: String,
              val extractor: String,
              val duration: String,
              val formats: List<FormatChoice>
          )

          object MediaDownloaderEngine {
              fun outputDirectory(context: Context): File =
                  File(context.getExternalFilesDir(null), "PyServer2_Media").apply { mkdirs() }

              fun analyzeUrl(
                  context: Context,
                  rawUrl: String,
                  preferPythonBridge: Boolean = true
              ): Result<MediaAnalysis> {
                  val url = rawUrl.trim()
                  if (url.isEmpty()) return Result.failure(Exception("URL empty"))

                  if (preferPythonBridge) {
                      val pyResult = PythonRunner.analyzeWithPythonBridge(context, url)
                      if (pyResult.isSuccess) return pyResult
                  }

                  val ytdlp = AssetsAndPackageManager.resolveTool(context, "yt-dlp")
                  val ytdlpFile = File(ytdlp)
                  if (!ytdlpFile.exists() || !ytdlpFile.canExecute()) {
                      val name = url.substringAfterLast("/").substringBefore("?").ifBlank { "media.mp4" }
                      return Result.success(
                          MediaAnalysis(
                              title = name,
                              extractor = "DirectFallback",
                              duration = "N/A",
                              formats = listOf(
                                  FormatChoice("direct", "Direct File Download", "video", "Direct stream"),
                                  FormatChoice("gif_clip", "Animated GIF (480w • 12fps)", "gif", "Requires FFmpeg"),
                                  FormatChoice("bestaudio", "Audio Only (MP3)", "audio", "Requires FFmpeg")
                              )
                          )
                      )
                  }

                  return try {
                      val proc = ProcessBuilder(ytdlp, "-J", "--no-playlist", url)
                          .redirectErrorStream(false)
                          .start()
                      val out = BufferedReader(InputStreamReader(proc.inputStream)).readText()
                      val err = BufferedReader(InputStreamReader(proc.errorStream)).readText()
                      val code = proc.waitFor()
                      if (code != 0 || out.isBlank()) {
                          return Result.failure(Exception(err.ifBlank { "Exit $code" }))
                      }
                      val root = JSONObject(out)
                      val arr: JSONArray = root.optJSONArray("formats") ?: JSONArray()
                      val formats = mutableListOf(
                          FormatChoice("best", "Best Quality • Auto Merge", "video", "Highest video + best audio")
                      )
                      val seen = mutableSetOf<String>()
                      for (i in 0 until arr.length()) {
                          val item = arr.getJSONObject(i)
                          val vcodec = item.optString("vcodec", "none")
                          val height = item.optInt("height", 0)
                          val ext = item.optString("ext", "mp4")
                          val fmtId = item.optString("format_id", "")
                          if (vcodec != "none" && height > 0 && fmtId.isNotEmpty()) {
                              val label = "${height}p • ${ext.uppercase()}"
                              if (seen.add(label)) {
                                  formats.add(FormatChoice(fmtId, label, "video", "Codec: $vcodec"))
                              }
                          }
                      }
                      formats.add(FormatChoice("gif_clip", "Animated GIF (480w • 12fps)", "gif", "Converted via FFmpeg"))
                      formats.add(FormatChoice("bestaudio", "Audio Only • MP3", "audio", "Extracted via FFmpeg"))
                      Result.success(
                          MediaAnalysis(
                              title = root.optString("title", "Media Stream"),
                              extractor = root.optString("extractor_key", "Generic"),
                              duration = root.optString("duration_string", "N/A"),
                              formats = formats
                          )
                      )
                  } catch (e: Exception) {
                      Result.failure(e)
                  }
              }

              fun downloadMedia(
                  context: Context,
                  rawUrl: String,
                  choice: FormatChoice,
                  useAria2: Boolean = true,
                  onLog: (String) -> Unit = {}
              ): Result<String> {
                  val url = rawUrl.trim()
                  val outDir = outputDirectory(context)
                  val ytdlp = AssetsAndPackageManager.resolveTool(context, "yt-dlp")
                  val ffmpeg = AssetsAndPackageManager.resolveTool(context, "ffmpeg")
                  val aria2 = AssetsAndPackageManager.resolveTool(context, "aria2c")

                  if (choice.formatId == "direct" || !File(ytdlp).exists() || !File(ytdlp).canExecute()) {
                      return directHttpDownload(url, outDir, onLog)
                  }

                  return try {
                      if (choice.mediaType == "gif") {
                          val animCfg = PythonRunner.loadAnimationConfig(context)
                          val fps = animCfg.optInt("gif_fps", 12)
                          val width = animCfg.optInt("gif_width", 480)
                          val tempMp4 = File(outDir, "tmp_gif_${System.currentTimeMillis()}.mp4")
                          val outGif = File(outDir, "anim_${System.currentTimeMillis()}.gif")

                          val dlCmd = mutableListOf(ytdlp, "--no-playlist", "-f", "best[height<=720]/best", "-o", tempMp4.absolutePath)
                          if (File(ffmpeg).exists() && File(ffmpeg).canExecute()) {
                              dlCmd.addAll(listOf("--ffmpeg-location", ffmpeg))
                          }
                          dlCmd.add(url)
                          val dlCode = ProcessBuilder(dlCmd).redirectErrorStream(true).start().waitFor()
                          if (dlCode != 0 || !tempMp4.exists()) {
                              return Result.failure(Exception("GIF source download failed"))
                          }

                          val ffCmd = listOf(
                              ffmpeg, "-y", "-i", tempMp4.absolutePath,
                              "-vf", "fps=$fps,scale=$width:-1:flags=lanczos",
                              outGif.absolutePath
                          )
                          val ffCode = ProcessBuilder(ffCmd).redirectErrorStream(true).start().waitFor()
                          if (tempMp4.exists()) tempMp4.delete()
                          return if (ffCode == 0 && outGif.exists()) {
                              Result.success("Saved GIF: ${outGif.absolutePath}")
                          } else {
                              Result.failure(Exception("FFmpeg GIF conversion failed"))
                          }
                      }

                      val outTemplate = File(outDir, "%(title).75s [%(id)s].%(ext)s").absolutePath
                      val cmd = mutableListOf(ytdlp, "--no-playlist", "-o", outTemplate)
                      if (File(ffmpeg).exists() && File(ffmpeg).canExecute()) {
                          cmd.addAll(listOf("--ffmpeg-location", ffmpeg))
                      }
                      if (useAria2 && File(aria2).exists() && File(aria2).canExecute()) {
                          cmd.addAll(listOf("--downloader", aria2, "--downloader-args", "aria2c:-x 8 -s 8 -k 1M"))
                          onLog("Using aria2c")
                      }
                      when {
                          choice.mediaType == "audio" ->
                              cmd.addAll(listOf("-f", "bestaudio/best", "-x", "--audio-format", "mp3"))
                          choice.formatId == "best" ->
                              cmd.addAll(listOf("-f", "bv*+ba/b", "--merge-output-format", "mp4"))
                          else ->
                              cmd.addAll(listOf("-f", "${choice.formatId}+bestaudio/best", "--merge-output-format", "mp4"))
                      }
                      cmd.add(url)
                      val proc = ProcessBuilder(cmd).redirectErrorStream(true).start()
                      val tail = StringBuilder()
                      proc.inputStream.bufferedReader().forEachLine { line ->
                          onLog(line)
                          if (tail.length > 2000) tail.delete(0, tail.length - 1200)
                          tail.append(line).append("\n")
                      }
                      val code = proc.waitFor()
                      if (code == 0) Result.success("Saved in ${outDir.absolutePath}")
                      else Result.failure(Exception("Exit $code: ${tail.toString().takeLast(240)}"))
                  } catch (e: Exception) {
                      Result.failure(e)
                  }
              }

              private fun directHttpDownload(
                  url: String,
                  outDir: File,
                  onLog: (String) -> Unit
              ): Result<String> {
                  return try {
                      val name = url.substringAfterLast("/").substringBefore("?")
                          .ifBlank { "media_${System.currentTimeMillis()}.mp4" }
                      val dest = File(outDir, name)
                      onLog("Direct download -> $name")
                      val conn = (URL(url).openConnection() as HttpURLConnection).apply {
                          requestMethod = "GET"
                          instanceFollowRedirects = true
                          connectTimeout = 20000
                          readTimeout = 60000
                      }
                      if (conn.responseCode !in 200..299) {
                          return Result.failure(Exception("HTTP ${conn.responseCode}"))
                      }
                      conn.inputStream.use { input ->
                          FileOutputStream(dest).use { output ->
                              val buf = ByteArray(16384)
                              while (true) {
                                  val r = input.read(buf)
                                  if (r == -1) break
                                  output.write(buf, 0, r)
                              }
                              output.flush()
                          }
                      }
                      conn.disconnect()
                      Result.success("Saved to ${dest.absolutePath}")
                  } catch (e: Exception) {
                      Result.failure(e)
                  }
              }
          }
