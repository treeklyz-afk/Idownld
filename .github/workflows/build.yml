name: Build PyServer 2.0 Standalone APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - "packages/manifest.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.13 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Build bundled QuickJS-NG for supported ABIs
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.12.1 https://github.com/quickjs-ng/quickjs.git /tmp/quickjs-ng
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          mkdir -p app/src/main/assets/runtimes
          for ABI in arm64-v8a x86_64; do
            BUILD_DIR="/tmp/qjs-build-$ABI"
            cmake -S /tmp/quickjs-ng -B "$BUILD_DIR" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-29 \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build "$BUILD_DIR" --target qjs_exe --parallel 2
            install -m 0755 "$BUILD_DIR/qjs" "app/src/main/assets/runtimes/qjs-$ABI"
            "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "app/src/main/assets/runtimes/qjs-$ABI" | grep -E 'Class:|Machine:'
          done

      - name: Build bundled aria2c for supported ABIs
        run: bash scripts/build-aria2-android.sh

      - name: Build debug APK from tracked app sources
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyServer2-Standalone-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
