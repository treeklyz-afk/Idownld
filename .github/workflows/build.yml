      - name: Push scaffolded sources to GitHub repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Scaffold PyServer 2.0 Jetpack Compose project sources"
            git push origin HEAD:main
          fi

      - name: Fetch ARM64 tools into assets/tools
        run: |
          mkdir -p app/src/main/assets/tools
          curl -fsSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux_aarch64 -o app/src/main/assets/tools/yt-dlp || true
          curl -fsSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-arm64-static.tar.xz -o /tmp/ffmpeg.tar.xz || true
          if [ -f /tmp/ffmpeg.tar.xz ]; then
            tar -xf /tmp/ffmpeg.tar.xz -C /tmp
            cp /tmp/ffmpeg-*-arm64-static/ffmpeg app/src/main/assets/tools/ffmpeg || true
            cp /tmp/ffmpeg-*-arm64-static/ffprobe app/src/main/assets/tools/ffprobe || true
          fi
          chmod +x app/src/main/assets/tools/* 2>/dev/null || true

      - name: Setup Gradle Wrapper & JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Gradle Wrapper exists
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyServer2-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
