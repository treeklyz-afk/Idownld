                                          verticalArrangement = Arrangement.spacedBy(10.dp)
                                      ) {
                                          Row(
                                              modifier = Modifier.fillMaxWidth(),
                                              horizontalArrangement = Arrangement.SpaceBetween,
                                              verticalAlignment = Alignment.CenterVertically
                                          ) {
                                              Text("Background Service", color = Color.White, fontWeight = FontWeight.Bold)
                                              Switch(
                                                  checked = bgActiveState.value,
                                                  onCheckedChange = { enabled ->
                                                      bgActiveState.value = enabled
                                                      val intent = Intent(context, BackgroundEngineService::class.java).apply {
                                                          putExtra("gateway_url", gatewayUrlState.value.trim())
                                                          putExtra("token", apiTokenState.value.trim())
                                                      }
                                                      if (enabled) ContextCompat.startForegroundService(context, intent)
                                                      else context.stopService(intent)
                                                  }
                                              )
                                          }
                                          OutlinedTextField(
                                              value = gatewayUrlState.value,
                                              onValueChange = { gatewayUrlState.value = it },
                                              label = { Text("Render Gateway URL") },
                                              singleLine = true,
                                              shape = RoundedCornerShape(12.dp),
                                              modifier = Modifier.fillMaxWidth()
                                          )
                                          OutlinedTextField(
                                              value = apiTokenState.value,
                                              onValueChange = { apiTokenState.value = it },
                                              label = { Text("API Token (/tokenrender)") },
                                              singleLine = true,
                                              shape = RoundedCornerShape(12.dp),
                                              modifier = Modifier.fillMaxWidth()
                                          )
                                          OutlinedButton(
                                              onClick = {
                                                  val base = gatewayUrlState.value.trim().trimEnd('/')
                                                  context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("$base/tokenrender")))
                                              },
                                              shape = RoundedCornerShape(12.dp),
                                              modifier = Modifier.fillMaxWidth()
                                          ) {
                                              Text("Open /tokenrender", color = cyanAccent)
                                          }
                                      }
                                  }
                              }
                          }
                      }

                      item {
                          Card(
                              colors = CardDefaults.cardColors(containerColor = Color(0xFF0A0F18)),
                              shape = RoundedCornerShape(14.dp),
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .border(1.dp, borderNeon, RoundedCornerShape(14.dp))
                          ) {
                              Column(
                                  modifier = Modifier.padding(12.dp),
                                  verticalArrangement = Arrangement.spacedBy(4.dp)
                              ) {
                                  Text(
                                      "Engine Console",
                                      color = cyanAccent,
                                      style = MaterialTheme.typography.labelLarge,
                                      fontWeight = FontWeight.Bold
                                  )
                                  logsState.value.forEach { line ->
                                      Text(
                                          line,
                                          color = Color(0xFFCBD5E1),
                                          style = MaterialTheme.typography.bodySmall,
                                          fontFamily = FontFamily.Monospace,
                                          maxLines = 2,
                                          overflow = TextOverflow.Ellipsis
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Fetch ARM64 tools into assets/tools
        run: |
          mkdir -p app/src/main/assets/tools
          curl -fsSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux_aarch64 -o app/src/main/assets/tools/yt-dlp || true
          curl -fsSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-arm64-static.tar.xz -o /tmp/ffmpeg.tar.xz || true
          if [ -f /tmp/ffmpeg.tar.xz ]; then
            tar -xf /tmp/ffmpeg.tar.xz -C /tmp
            cp /tmp/ffmpeg-*-arm64-static/ffmpeg app/src/main/assets/tools/ffmpeg || true
            cp /tmp/ffmpeg-*-arm64-static/ffprobe app/src/main/assets/tools/ffprobe || true
          fi
          chmod +x app/src/main/assets/tools/* 2>/dev/null || true

      - name: Push scaffolded project sources to main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Build PyServer 2.0 smart APK with GIF & JSON animations"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

      - name: Setup JDK 17 & Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle CLI
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper exists
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x ./gradlew

      - name: Smart Build with Log-Driven Auto-Repair
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace > /tmp/gradle_build.log 2>&1
          EXIT_CODE=$?
          cat /tmp/gradle_build.log

          if [ $EXIT_CODE -ne 0 ]; then
            echo "Build failed — analyzing compiler errors and auto-repairing..."
            python3 - <<'PY'
          import pathlib, re

          log_text = pathlib.Path("/tmp/gradle_build.log").read_text(encoding="utf-8", errors="ignore")
          error_files = set(re.findall(r"e:\s*file://(/[^:\s]+\.kt):", log_text))

          for fpath in error_files:
              p = pathlib.Path(fpath)
              if not p.exists():
                  continue
              src = p.read_text(encoding="utf-8")
              orig = src
              src = re.sub(
                  r"\bvar\s+([A-Za-z0-9_]+)\s+by\s+remember\s*\{\s*mutableStateOf\((.*?)\)\s*\}",
                  r"val \1State = remember { mutableStateOf(\2) }",
                  src,
              )
              src = re.sub(r"\b(Color\.[A-Za-z0-9_]+)\.value\b", r"\1", src)
              src = re.sub(r"\.value\.value\b", ".value", src)
              if src != orig:
                  p.write_text(src, encoding="utf-8")
                  print(f"Auto-repaired: {p}")
          PY
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyServer2-Smart-APK
          path: app/build/outputs/apk/debug/app-debug.apk
